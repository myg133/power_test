[package]
name = "power_test"
version = "0.2.4"
edition = "2021"
description = "HTTP-level stress testing tool for LLM inference endpoints"
license = "MIT"

[[bin]]
name = "power_test"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hdrhistogram = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
tokio-stream = "0.1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
ratatui = "0.26"
crossterm = "0.27"
toml = "0.8"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
