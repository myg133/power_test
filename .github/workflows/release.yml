name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # softprops/action-gh-release needs this to attach files

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            archive_ext: tar.gz
          - os: windows-latest
            label: windows-x86_64
            archive_ext: zip
          - os: macos-14                # Apple Silicon runner (M1, arm64 output)
            label: macos-arm64
            archive_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release
        run: cargo build --release --locked

      - name: Stage artifacts (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p staging
          cp target/release/power_test staging/
          cp README.md staging/ 2>/dev/null || true

      - name: Stage artifacts (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          Copy-Item target/release/power_test.exe staging/
          Copy-Item README.md staging/ -ErrorAction SilentlyContinue

      - name: Package (unix → tar.gz)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd staging
          tar czf ../power_test-${{ github.ref_name }}-${{ matrix.label }}.tar.gz *

      - name: Package (windows → zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path staging/* `
            -DestinationPath "power_test-${{ github.ref_name }}-${{ matrix.label }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: power_test-${{ matrix.label }}
          path: power_test-${{ github.ref_name }}-${{ matrix.label }}.${{ matrix.archive_ext }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            power_test-${{ github.ref_name }}-${{ matrix.label }}.${{ matrix.archive_ext }}
          fail_on_unmatched_files: false
          generate_release_notes: true
